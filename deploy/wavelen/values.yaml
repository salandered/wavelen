image:
  repository: ghcr.io/salandered/wavelen
  tag: "" # templates default to .Chart.AppVersion

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    # no cpu for now
    memory: 128Mi

# Ceiling for the Go GC, ~80% of resources.limits.memory
goMemLimit: 100MiB

# Set per cluster
ingress:
  host: ""

tls:
  enabled: false
  secretName: wavelen-tls
  issuer: ""

redirect:
  enabled: false

# Traefik rateLimit on the Ingress, per client IP, per second.
# NOTE: Keyed on the real client only when traefikSourceIP.enabled: true.
rateLimit:
  enabled: false
  average: 50
  burst: 100

# Reconfigures the k3s Traefik Service to externalTrafficPolicy: Local
# Makes sense when Traefik fronts real clients.
traefikSourceIP:
  enabled: false
