apiVersion: batch/v1
kind: Job
metadata:
  name: wavelen-migrate
  annotations:
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    # deletes the previous hook when the next one is created
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6 # attempts before failed
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: wavelen-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/migrate"] # overrides the image's ENTRYPOINT
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
          env:
            - name: GOMEMLIMIT # ~80% of the resources.limits.memory
              value: 48MiB
          envFrom:
            - configMapRef:
                name: wavelen-config
            - secretRef:
                name: wavelen-db
