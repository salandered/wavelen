# default ClusterIP service type
# targets http port targetPort on any Pod with the label app: wavelen
apiVersion: v1
kind: Service
metadata:
  name: wavelen
  labels:
    {{- include "wavelen.appLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    app: wavelen # matches pod labels
  ports:
    - name: http
      port: 8080
      targetPort: 8080