# https://doc.traefik.io/traefik/reference/routing-configuration/kubernetes/ingress
# "requests for host Values.ingress.host, path prefix /, go to Service wavelen on port 8080"
{{- $middlewares := include "wavelen.middlewares" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wavelen
  labels:
    {{- include "wavelen.appLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  # $middlewares is a string from helpers;
  # if it is not empty (at least one middleware is enabled), it counts as a true
  {{- if or .Values.tls.enabled $middlewares }}
  annotations:
    {{- if .Values.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.tls.issuer }}
    {{- end }}
    {{- with $middlewares }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ . }}
    {{- end }}
  {{- end }}

spec:
  ingressClassName: traefik
  {{- if .Values.tls.enabled }}
  # https://kubernetes.io/docs/concepts/services-networking/ingress/#tls
  tls:
    - hosts:
        - {{ required "ingress.host must be set" .Values.ingress.host | quote }}
      secretName: {{ .Values.tls.secretName }} # created by cert-manager
  {{- end }}
  rules:
    - host: {{ required "ingress.host must be set" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wavelen
                port:
                  number: 8080 # Service port
