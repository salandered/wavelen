openapi: 3.0.4
info:
  title: Wavelen API
  version: 1.0.0
  description: >-
    Users save hex colors. A seeded palette of 100 named colors is served read-only.
    There is no auth: the user id in the path is the only identity, so any caller can
    read any user's list.
# No servers block on purpose. kin-openapi's gorillamux router matches the host, and the
# API suite serves from httptest on a random 127.0.0.1 port. A declared server would make
# FindRoute miss every route.
tags:
  - name: System
    description: Operational
  - name: Users
    description: User accounts
  - name: Colors
    description: A user's own saved colors
  - name: Palette
    description: The shared read-only palette

paths:
  /:
    get:
      tags: [System]
      summary: Returns the service name
      responses:
        "200":
          description: Successful response
          content:
            text/plain:
              schema:
                type: string
                example: "wavelen"

  /api/v1/users:
    post:
      tags: [Users]
      summary: Creates a user
      description: >-
        The email is trimmed and lowercased before storage. Uniqueness ignores case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          headers:
            Location:
              description: Path of the new user
              schema:
                type: string
                example: /api/v1/users/1
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: The email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: email already registered
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/users/{user_id}/colors:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Colors]
      summary: Lists a user's saved colors
      description: >-
        Newest first. An unknown user is not distinguished from one who saved nothing,
        both answer 200 with an empty array.
      responses:
        "200":
          description: The user's colors
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListColorsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Colors]
      summary: Saves a color for a user
      description: >-
        Idempotent. Saving a color the user already has answers 200 instead of 201,
        with the same body, and adds no second row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddColorRequest"
      responses:
        "201":
          description: The color was added
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddColorResponse"
        "200":
          description: The user had already saved this color
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddColorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: No such user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: user not found
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/colors:
    get:
      tags: [Palette]
      summary: Lists the shared palette
      description: The 100 seeded named colors, ordered by name.
      responses:
        "200":
          description: The palette
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCommonColorsResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  headers:
    XRequestId:
      description: >-
        Correlation id. Echoed from the request when it carries one, generated otherwise.
      schema:
        type: string

  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1

  schemas:
    HexStored:
      type: string
      description: A color code as stored and returned, lowercase with a leading '#'.
      pattern: "^#[0-9a-f]{6}$"
      example: "#ff00aa"

    HexInput:
      type: string
      description: >-
        A color code as accepted. Surrounding whitespace is trimmed, the leading '#' is
        optional, and case does not matter. The normalized form is what gets stored.
      pattern: "^\\s*#?[0-9a-fA-F]{6}\\s*$"
      example: "FF00AA"

    CreateUserRequest:
      type: object
      required: [email, name]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: ada@example.com
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Length is counted in runes, after trimming.
          example: Ada Lovelace

    User:
      type: object
      required: [id, email, name, created_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: ada@example.com
        name:
          type: string
          example: Ada Lovelace
        created_at:
          type: string
          format: date-time
          example: "2026-08-22T13:37:08.688203Z"

    CreateUserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    AddColorRequest:
      type: object
      required: [hex]
      additionalProperties: false
      properties:
        hex:
          $ref: "#/components/schemas/HexInput"

    AddColorResponse:
      type: object
      required: [hex]
      description: Echoes the normalized hex, so the client learns what was stored.
      properties:
        hex:
          $ref: "#/components/schemas/HexStored"

    SavedColor:
      type: object
      required: [hex, created_at]
      properties:
        hex:
          $ref: "#/components/schemas/HexStored"
        created_at:
          type: string
          format: date-time
          example: "2026-08-22T13:37:08.825023Z"

    ListColorsResponse:
      type: object
      required: [colors]
      properties:
        colors:
          type: array
          items:
            $ref: "#/components/schemas/SavedColor"

    CommonColor:
      type: object
      required: [hex, name]
      properties:
        hex:
          $ref: "#/components/schemas/HexStored"
        name:
          type: string
          example: black

    ListCommonColorsResponse:
      type: object
      required: [colors]
      properties:
        colors:
          type: array
          items:
            $ref: "#/components/schemas/CommonColor"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: >-
            For 5xx this is always the literal "internal server error", the real cause
            only reaches the logs.
          example: invalid hex color

  responses:
    BadRequest:
      description: Malformed path parameter, body, or field
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: 'invalid hex color: want 6 hex digits, got "nope"'

    PayloadTooLarge:
      description: The body exceeded 64 kb
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: request body too large

    InternalServerError:
      description: Unexpected failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: internal server error
