# Values come from .env
services:
  app:
    build:
      context: .
      args:
        VERSION: "${VERSION:-dev}"
    container_name: wavelen-api
    ports:
      - "127.0.0.1:${PORT:-8080}:${PORT:-8080}" # loopback only
    environment:
      PORT: "${PORT:-8080}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432" # use 5432, how app reaches the service
      POSTGRES_SSLMODE: disable
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wavelen}
      DB_CONNECT_TIMEOUT: "${DB_CONNECT_TIMEOUT:-30s}"
      DB_PING_BACKOFF: "${DB_PING_BACKOFF:-1s}"
      SHUTDOWN_TIMEOUT: "${SHUTDOWN_TIMEOUT:-10s}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      LOG_FORMAT: "${LOG_FORMAT:-text}"
      LOG_FILE: "${LOG_FILE:-}"
      LOG_TIME: "${LOG_TIME:-dt-milli}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    container_name: wavelen-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wavelen}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - wavelen-pgdata:/var/lib/postgresql
    healthcheck:
      # $$ escapes the interpolation, the container shell expands these from its own env
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wavelen-pgdata:
