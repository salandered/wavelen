services:
  postgres:
    image: postgres:18-alpine
    container_name: wavelen-postgres
    environment:
      POSTGRES_USER: justuser
      POSTGRES_PASSWORD: justuser
      POSTGRES_DB: wavelen
    ports:
      - "5433:5432"
    volumes:
      - wavelen-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justuser -d wavelen"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wavelen-pgdata:
