apiVersion: apps/v1
kind: Deployment
metadata:
  name: wavelen
spec:
  replicas: 1
  selector: # how the ReplicaSet finds Pods
    matchLabels:
      app: wavelen
  template:
    metadata:
      labels: # Pod is labeled wavelen
        app: wavelen
    spec: # Pod runs one container (api app)
      containers:
        - name: api
          image: ghcr.io/salandered/wavelen:0.1.1
          envFrom:
            - configMapRef:
                name: wavelen-config
            - secretRef:
                name: wavelen-db
          
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            # run the probe every 10, an attempt has a 2 to answer, 3 attempts budget
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3