<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>wavelen</title>
	<link rel="icon" type="image/png" href="logo-mini.png">

	<!--
		Deliberately NOT deferred, and deliberately not in app.js: this has to stamp the
		attribute before the first paint, otherwise a stored theme that disagrees with the
		system one flashes on every load. It also runs before <body> exists, which is why the
		attribute goes on <html>. The swatch-info class needs none of this: swatches are
		rendered by app.js long after the first paint.
	-->
	<script>
		try {
			const stored = localStorage.getItem("theme");
			if (stored) {
				document.documentElement.dataset.theme = stored;
			}
		} catch {
			// no storage, the system preference is used
		}
	</script>

	<!-- defer, so the document exists when the script runs and it needs no load listener -->
	<script defer src="/app.js"></script>
	<style>
		:root {
			/* with no data-theme the browser decides, and light-dark() follows color-scheme */
			color-scheme: light dark;
			--fg: light-dark(#1c1a17, #ece7de);
			--muted: light-dark(#6b6357, #9b9184);
			--line: light-dark(#d6cfc2, #403a32);
			--error: light-dark(#9b2f1c, #ee967d);
		}

		/* overriding color-scheme re-resolves every light-dark() above in one repaint */
		:root[data-theme="light"] {
			color-scheme: light;
		}

		:root[data-theme="dark"] {
			color-scheme: dark;
		}

		/*
			visibility, not display: the labels keep their box, so hiding them does not resize
			a single swatch. With display:none the grid rows collapse to the min-height below
			and every swatch visibly shrinks.
		*/
		:root.no-swatch-info .swatch span {
			visibility: hidden;
		}

		html {
			/* reserve the scrollbar track, so a short list does not shift the centered body */
			scrollbar-gutter: stable;
		}

		body {
			font-family: system-ui, sans-serif;
			max-width: 60rem;
			margin: 2rem auto;
			padding: 0 1rem;
			color: var(--fg);
		}

		header {
			display: flex;
			align-items: baseline;
			gap: 0.5rem;
			margin-bottom: 1.5rem;
		}

		h1 {
			font-size: 1.25rem;
			margin: 0;
			margin-right: auto;
		}

		summary,
		.panel-title {
			font-size: 0.8rem;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			color: var(--muted);
			margin: 0 0 0.75rem;
			padding-bottom: 0.35rem;
			border-bottom: 1px solid var(--line);
		}

		summary {
			cursor: pointer;
			user-select: none;
		}

		details:not([open]) summary {
			margin-bottom: 0;
		}

		details {
			margin-bottom: 2rem;
		}

		/* the grids on the left, the clicked color on the right */
		.split {
			display: flex;
			align-items: flex-start;
			gap: 1.5rem;
		}

		/* min-width, or a grid row sized by its content would push the aside past the edge */
		main {
			flex: 1;
			min-width: 0;
		}

		/* sticky, so the color stays in view while a long list scrolls beside it */
		aside {
			flex: 0 0 15rem;
			position: sticky;
			top: 2rem;
		}

		/* below this the two columns are both too narrow to be worth keeping side by side */
		@media (max-width: 38rem) {
			.split {
				flex-direction: column;
			}

			aside {
				flex: none;
				position: static;
				align-self: stretch;
			}
		}

		.row {
			display: flex;
			align-items: center;
			gap: 0.5rem;
			flex-wrap: wrap;
			margin-bottom: 0.5rem;
		}

		label {
			color: var(--muted);
			font-size: 0.85rem;
		}

		input,
		select,
		button {
			font: inherit;
			font-size: 0.85rem;
			padding: 0.25rem 0.5rem;
			border: 1px solid var(--line);
			border-radius: 3px;
			background: transparent;
			color: inherit;
		}

		/*
			The rule above is wrong for a select and only for a select: the popup is painted by the
			browser, which cannot paint it transparent, so it came out light while the inherited
			color stayed light - unreadable in the dark theme. Canvas and CanvasText resolve
			against color-scheme, which the theme button already flips, so naming them here follows
			the toggle for free. Same mechanism .swatch.selected uses for its inner ring.
		*/
		select,
		option {
			background: Canvas;
			color: CanvasText;
		}

		button {
			cursor: pointer;
		}

		#login-password,
		#new-password {
			width: 8rem;
		}

		.who {
			font-size: 0.85rem;
			margin-right: auto;
		}

		/* fixed, so flipping the label does not shift the controls beside it */
		#order,
		#palette-order {
			min-width: 4.5rem;
		}

		#load-more {
			margin-top: 0.75rem;
		}

		#hex {
			width: 8rem;
			font-family: ui-monospace, monospace;
		}

		/* the aside's panels: the same heading and spacing a details section gets on the left */
		.panel {
			margin-bottom: 2rem;
		}

		.panel:last-child {
			margin-bottom: 0;
		}

		/*
			Capped rather than free-growing: ten entries of one line each fit, but a couple of long
			failures would push the panel past the viewport and take the sticky aside with it.
		*/
		#log {
			max-height: 14rem;
			overflow-y: auto;
		}

		#log p {
			margin: 0 0 0.4rem;
			font-size: 0.8rem;
			color: var(--muted);
			/* a hex or a proxy error has no spaces to break at, and the panel is 15rem */
			overflow-wrap: anywhere;
		}

		#log p.failed {
			color: var(--error);
		}

		/*
			Five across. There is no border-box reset, so max-width is body's content box: the grids
			get 60rem less the aside and the gap, which is 43.5rem. Five of these need 41.6rem and a
			sixth would need 50rem, so auto-fill settles on five and stretches them to 8.4rem.
		*/
		.grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr));
			gap: 0.4rem;
		}

		.swatch {
			display: flex;
			flex-direction: column;
			gap: 0.1rem;
			/* a floor for the shortest labels, the two lines are taller than this anyway */
			min-height: 3.2rem;
			padding: 0.6rem 0.5rem;
			border: 1px solid var(--line);
			text-align: left;
			font-family: ui-monospace, monospace;
			font-size: 0.75rem;
		}

		/*
			A box-shadow rather than an outline: the swatch keeps its own focus ring, and the
			inner Canvas ring separates the marker from the swatch color, so it reads on any
			of them.
		*/
		.swatch.selected {
			box-shadow: 0 0 0 2px Canvas, 0 0 0 4px var(--fg);
		}

		.swatch .label {
			font-family: system-ui, sans-serif;
			opacity: 0.75;
			/* names and timestamps are longer than the swatch, and wrapping breaks the grid */
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		/*
			Same shape as .detail-stack below and for the same reason: a button cannot contain a
			button, so the delete control is a sibling stacked on the swatch rather than inside it.
			The grid sizes this cell, and the swatch stretches to fill it in both directions, which
			is what keeps a row of swatches one height.

			minmax(0, 1fr), not the default auto track: an auto track grows toward the swatch's
			max-content width, which is its label on one line. The swatch would then be wider than
			the cell the outer grid sized, overflow to the right and paint over the gap - the
			saved list showing it first only because a timestamp is longer than a color name.
		*/
		.cell {
			position: relative;
			display: grid;
			grid-template-columns: minmax(0, 1fr);
		}

		/*
			Hidden until the pointer or the keyboard reaches the cell. visibility, not display, for
			the same reason as the labels above: the button keeps its box, so nothing reflows when
			it appears. Deleting is the one destructive thing this page does, which is why it does
			not sit in the tab order of a grid that is otherwise all navigation.
		*/
		.cell .remove {
			position: absolute;
			top: 0.15rem;
			right: 0.15rem;
			padding: 0 0.25rem;
			border: none;
			background: none;
			font-size: 0.9rem;
			line-height: 1.2;
			visibility: hidden;
		}

		.cell:hover .remove,
		.cell:focus-within .remove {
			visibility: visible;
		}

		/* a touch screen never hovers, so there the control has nothing to come out of */
		@media (hover: none) {
			.cell .remove {
				visibility: visible;
			}
		}

		/* the hex sits on the color rather than inside it, so the two clicks stay separate */
		.detail-stack {
			position: relative;
		}

		.detail-color {
			/* the one border-box on the page: aspect-ratio squares the content box, not this one */
			box-sizing: border-box;
			display: block;
			width: 100%;
			/* square, and wider than a swatch: this is the one meant to be looked at */
			aspect-ratio: 1;
			padding: 0;
			border: 1px solid var(--line);
		}

		/*
			The UA stylesheet sizes the fullscreen element, but this file's own square, border and
			radius all survive it: the first letterboxes the color, the second draws a hairline along
			the screen edge, and the third rounds the corners and shows the backdrop through them.
		*/
		.detail-color:fullscreen {
			aspect-ratio: auto;
			width: 100%;
			height: 100%;
			border: none;
			border-radius: 0;
		}

		.detail-hex {
			position: absolute;
			left: 0.5rem;
			bottom: 0.6rem;
			padding: 0.1rem 0.25rem;
			border: none;
			background: transparent;
			font-family: ui-monospace, monospace;
		}

		/*
			The only sign it is clickable: it sits on the color with no chrome of its own, and an
			underline is the one mark that reads against every background.
		*/
		.detail-hex:hover {
			text-decoration: underline;
		}

		.detail-label {
			margin: 0.4rem 0 0;
			color: var(--muted);
			font-size: 0.8rem;
			/* a name or a timestamp is wider than the panel, and here there is room to wrap it */
			overflow-wrap: break-word;
		}

		/*
			A plain element, not a button: each band is its own stack of two controls and a button
			cannot contain a button. This is what requestFullscreen is called on, so the whole
			strip goes at once however many bands it has.
		*/
		.harmony {
			display: flex;
			gap: 0.25rem;
			width: 100%;
		}

		/* the same shape as .detail-stack: the color is the control, the hex sits on it */
		.harmony .band {
			position: relative;
			flex: 1;
		}

		.harmony .band-color {
			/* border-box for the same reason .detail-color needs it: aspect-ratio squares the
			   content box, and a border would make the square taller than it is wide */
			box-sizing: border-box;
			display: block;
			width: 100%;
			/* squares in the panel; the fullscreen rule below drops this so they become bands */
			aspect-ratio: 1;
			padding: 0;
			border: 1px solid var(--line);
		}

		/*
			Full width and centered rather than sized to its text: the whole bottom of a band is
			the copy target, which at three bands is the difference between an easy click and a
			careful one.
		*/
		.harmony .band-hex {
			position: absolute;
			left: 0;
			right: 0;
			bottom: 0.3rem;
			padding: 0;
			border: none;
			background: transparent;
			font-family: ui-monospace, monospace;
			font-size: 0.8rem;
			text-align: center;
		}

		/* same single affordance .detail-hex uses, and for the same reason */
		.harmony .band-hex:hover {
			text-decoration: underline;
		}

		/*
			The gap goes with it: the UA paints the fullscreen element on black, which would
			otherwise show through as lines down the screen.
		*/
		.harmony:fullscreen {
			height: 100%;
			gap: 0;
		}

		.harmony:fullscreen .band-color {
			height: 100%;
			aspect-ratio: auto;
			border: none;
		}

		.harmony:fullscreen .band-hex {
			bottom: 1.5rem;
			font-size: 1.25rem;
		}

		.empty {
			color: var(--muted);
			font-size: 0.85rem;
			margin: 0;
		}
	</style>
</head>

<body>
	<header>
		<h1>wavelen</h1>
	</header>

	<div class="split">
		<main>
		<details data-collapse-key="account" open>
			<summary>Account</summary>

			<!-- Both states live in the markup and app.js hides one. The panel is the first thing
			     rendered, so building either one from script would flash the wrong state. -->
			<div id="logged-out">
				<form class="row" id="login-form">
					<label for="login-nick">log in</label>
					<input id="login-nick" placeholder="nickname" autocomplete="username">
					<input id="login-password" type="password" placeholder="password"
						autocomplete="current-password">
					<button>log in</button>
				</form>
				<form class="row" id="signup-form">
					<label for="new-nick">sign up</label>
					<input id="new-nick" placeholder="nickname" autocomplete="username">
					<input id="new-name" placeholder="name">
					<input id="new-password" type="password" placeholder="password"
						autocomplete="new-password">
					<button>create user</button>
					<button type="button" id="random-user">random</button>
				</form>
			</div>

			<div class="row" id="logged-in" hidden>
				<!-- the login response answers with an id and nothing else, so the id is what this
				     names. Showing the typed nickname instead would show it unnormalized. -->
				<span class="who" id="who"></span>
				<button type="button" id="logout">log out</button>
				<button type="button" id="load">reload colors</button>
			</div>
		</details>

		<details data-collapse-key="saved" id="saved-section" open>
			<summary>Saved colors</summary>
			<form class="row" id="add-form">
				<input id="hex" placeholder="#ff00aa" aria-label="hex color">
				<button>add</button>
				<!-- type=button, or it would submit the form instead of filling the field -->
				<button type="button" id="random-hex">random</button>
				<button type="button" id="bulk-add" title="dev only: 20 separate POSTs">
					add 20 random
				</button>
			</form>
			<!-- order reads as descending/ascending rather than newest/oldest, it applies to hex too -->
			<div class="row">
				<label for="sort">sort by</label>
				<select id="sort">
					<option value="created_at">date</option>
					<option value="hex">hex</option>
					<option value="color">color</option>
				</select>
				<!-- the label is the current order and is written by app.js, the title is the action -->
				<button type="button" id="order" data-order="desc"></button>
				<label for="limit">per page</label>
				<select id="limit">
					<option value="10">10</option>
					<option value="20" selected>20</option>
					<option value="50">50</option>
					<option value="100">100</option>
				</select>
			</div>
			<div class="grid" id="saved"></div>
			<!-- hidden until a response carries a next_cursor, which is the end-of-list signal -->
			<button type="button" id="load-more" hidden>load more</button>
		</details>

		<details data-collapse-key="palette" open>
			<summary>Palette</summary>
			<!-- the palette is 100 fixed rows, so it sorts but never pages -->
			<div class="row">
				<label for="palette-sort">sort by</label>
				<select id="palette-sort">
					<option value="name">name</option>
					<option value="hex">hex</option>
					<option value="color">color</option>
				</select>
				<button type="button" id="palette-order" data-order="asc"></button>
			</div>
			<div class="grid" id="palette"></div>
		</details>
		</main>

		<aside>
			<section class="panel">
				<h2 class="panel-title">View</h2>
				<div class="row">
					<button type="button" id="swatch-info"></button>
					<button type="button" id="theme"></button>
				</div>
			</section>

			<section class="panel">
				<h2 class="panel-title">Selected</h2>
				<!-- filled by app.js: the empty state is a placeholder, not a blank panel -->
				<div id="detail"></div>
			</section>

			<section class="panel">
				<h2 class="panel-title">Harmony</h2>
				<!-- disabled until a swatch is clicked: both are about the selected color -->
				<div class="row">
					<button type="button" id="complement" disabled>complement</button>
					<button type="button" id="triad" disabled>triad</button>
				</div>
				<!-- filled by app.js, same as the panel above -->
				<div id="harmony"></div>
			</section>

			<section class="panel">
				<h2 class="panel-title">Log</h2>
				<!-- role=log, not status: entries are added, and only the new one is worth reading out -->
				<div id="log" role="log"></div>
			</section>
		</aside>
	</div>
</body>

</html>
