<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>wavelen</title>
	<link rel="icon" type="image/png" href="images/logo-mini.png">

	<!--
		Not deferred and not in app.js: the attribute has to be stamped before the first paint,
		or a stored theme that disagrees with the system one flashes on every load. It runs
		before <body> exists, so the attribute goes on <html>.
	-->
	<script>
		try {
			const stored = localStorage.getItem("theme");
			if (stored) {
				document.documentElement.dataset.theme = stored;
			}
		} catch {
			// no storage, the system preference is used
		}
	</script>

	<!-- defer, so the document exists when the script runs and it needs no load listener -->
	<script defer src="/app.js"></script>
	<style>
		:root {
			/* with no data-theme the browser decides, and light-dark() follows color-scheme */
			color-scheme: light dark;
			--fg: light-dark(#1c1a17, #ece7de);
			--muted: light-dark(#6b6357, #9b9184);
			--line: light-dark(#d6cfc2, #403a32);
			--error: light-dark(#9b2f1c, #ee967d);
		}

		/* overriding color-scheme re-resolves every light-dark() above in one repaint */
		:root[data-theme="light"] {
			color-scheme: light;
		}

		:root[data-theme="dark"] {
			color-scheme: dark;
		}

		/*
			visibility, not display: the labels keep their box, so hiding them doesn't resize a
			swatch. With display:none the grid rows collapse to the min-height below.
		*/
		:root.no-swatch-info .swatch span {
			visibility: hidden;
		}

		html {
			/* reserve the scrollbar track, so a short list does not shift the centered body */
			scrollbar-gutter: stable;
		}

		body {
			font-family: system-ui, sans-serif;
			max-width: 60rem;
			margin: 2rem auto;
			padding: 0 1rem;
			color: var(--fg);
		}

		header {
			display: flex;
			align-items: baseline;
			gap: 0.5rem;
			margin-bottom: 1.5rem;
		}

		h1 {
			font-size: 1.25rem;
			margin: 0;
			margin-right: auto;
		}

		summary,
		.panel-title {
			font-size: 0.8rem;
			font-weight: 600;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			color: var(--muted);
			margin: 0 0 0.75rem;
			padding-bottom: 0.35rem;
			border-bottom: 1px solid var(--line);
		}

		summary {
			cursor: pointer;
			user-select: none;
		}

		details:not([open]) summary {
			margin-bottom: 0;
		}

		details {
			margin-bottom: 2rem;
		}

		.split {
			display: flex;
			align-items: flex-start;
			gap: 1.5rem;
		}

		/* min-width, or a grid row sized by its content would push the aside past the edge */
		main {
			flex: 1;
			min-width: 0;
		}

		/* sticky, so the color stays in view while a long list scrolls beside it */
		aside {
			flex: 0 0 15rem;
			position: sticky;
			top: 2rem;
		}

		/* below this the two columns are both too narrow to be worth keeping side by side */
		@media (max-width: 38rem) {
			.split {
				flex-direction: column;
			}

			aside {
				flex: none;
				position: static;
				align-self: stretch;
			}
		}

		/*
		   The UA stylesheet hides [hidden] with display:none, which any display declared here
		   outranks - #logged-in is a .row, so it stayed on screen logged out. Four elements are
		   toggled through el.hidden, so the rule has to win outright.
		*/
		[hidden] {
			display: none !important;
		}

		.row {
			display: flex;
			align-items: center;
			gap: 0.5rem;
			flex-wrap: wrap;
			margin-bottom: 0.5rem;
		}

		label {
			color: var(--muted);
			font-size: 0.85rem;
		}

		input,
		select,
		button {
			font: inherit;
			font-size: 0.85rem;
			padding: 0.25rem 0.5rem;
			border: 1px solid var(--line);
			border-radius: 3px;
			background: transparent;
			color: inherit;
		}

		/*
			The transparent background above is wrong for a select: the browser paints the popup
			and cannot paint it transparent, so it came out light while the inherited color stayed
			light. Canvas and CanvasText resolve against color-scheme, which the theme button
			flips.
		*/
		select,
		option {
			background: Canvas;
			color: CanvasText;
		}

		button {
			cursor: pointer;
		}

		#login-password,
		#new-password {
			width: 8rem;
		}

		.tabs {
			display: flex;
			gap: 0.25rem;
			margin-bottom: 0.75rem;
			border-bottom: 1px solid var(--line);
		}

		/*
			The selected mark is 2px and the strip's own line is 1px, so the tab is pulled down
			over it. Without the negative margin the mark sits above the line instead of
			replacing it.
		*/
		.tab {
			padding: 0.25rem 0.6rem;
			margin-bottom: -1px;
			border: none;
			border-bottom: 2px solid transparent;
			border-radius: 0;
			color: var(--muted);
		}

		/* aria-selected is the only place the choice is recorded, so the style reads it */
		.tab[aria-selected="true"] {
			border-bottom-color: var(--fg);
			color: var(--fg);
			font-weight: 600;
		}

		.who {
			font-size: 0.85rem;
			margin-right: auto;
		}

		/*
			A cycler's label is its own value, so it needs a floor or stepping it shifts whatever
			sits beside it. Each width is the widest label in its set. #theme is last in its row
			and needs none of this.
		*/
		#sort,
		#palette-sort {
			min-width: 4rem;
		}

		#order,
		#palette-order {
			min-width: 4.5rem;
		}

		#swatch-info {
			min-width: 5.5rem;
		}

		#load-more {
			margin-top: 0.75rem;
		}

		#hex {
			width: 8rem;
			font-family: ui-monospace, monospace;
		}

		/* a value inside a heading, so it undoes the summary's own casing and spacing */
		#saved-in {
			text-transform: none;
			letter-spacing: 0;
			font-weight: 400;
		}

		#saved-in:not(:empty)::before {
			content: "- ";
		}

		.collections {
			display: flex;
			flex-wrap: wrap;
			gap: 0.4rem;
		}

		/* the chip carries the border, the two buttons inside it are bare */
		.collection {
			display: flex;
			align-items: center;
			border: 1px solid var(--line);
			border-radius: 3px;
		}

		.collection.active {
			border-color: var(--fg);
		}

		.collection-name,
		.collection-delete {
			border: none;
			border-radius: 0;
			background: none;
		}

		/* a name is up to collection.MaxNameLen runes, and a chip is not the place to show them */
		.collection-name {
			max-width: 12rem;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.collection.active .collection-name {
			font-weight: 600;
		}

		.collection .tag {
			padding-right: 0.5rem;
			color: var(--muted);
			font-size: 0.7rem;
		}

		/* always visible, unlike a swatch's delete: it doesn't sit on a color */
		.collection-delete {
			padding: 0 0.4rem;
			color: var(--muted);
			font-size: 0.9rem;
			line-height: 1.2;
		}

		/*
			The stroke settings are the same for every glyph in the sprite, so they sit here
			rather than on 27 <symbol>s. currentColor is what lets a parent tint a whole icon:
			the chip sets its color to the collection's accent.
		*/
		.icon {
			width: 1em;
			height: 1em;
			flex: none;
			fill: none;
			stroke: currentColor;
			stroke-width: 2;
			stroke-linecap: round;
			stroke-linejoin: round;
		}

		.collection-icon {
			margin-left: 0.5rem;
			font-size: 1.1rem;
		}

		/* the anchor .icon-picker is positioned against */
		.icon-menu {
			position: relative;
			display: flex;
		}

		.icon-trigger {
			display: flex;
			align-items: center;
			gap: 0.25rem;
			padding: 0.15rem 0.35rem;
			font-size: 1.1rem;
			line-height: 1;
		}

		/* not part of the preview, so muted rather than the accent */
		.icon-trigger .caret {
			font-size: 0.7rem;
			color: var(--muted);
		}

		/*
			Absolutely positioned, so opening it doesn't push the collection chips down the page.
		*/
		.icon-picker {
			position: absolute;
			top: calc(100% + 0.25rem);
			left: 0;
			z-index: 1;
			display: grid;
			grid-template-columns: repeat(5, auto);
			gap: 0.15rem;
			padding: 0.3rem;
			border: 1px solid var(--line);
			border-radius: 3px;
			/* opaque, or the chips behind show through. Canvas for the same reason a select does */
			background: Canvas;
		}

		.icon-option {
			padding: 0.25rem;
			border: 1px solid transparent;
			border-radius: 3px;
			background: none;
			font-size: 1.1rem;
			line-height: 0;
		}

		.icon-option:hover {
			border-color: var(--line);
		}

		.icon-option[aria-checked="true"] {
			border-color: var(--fg);
		}

		/*
			The browser draws the swatch in a box that ignores the padding the other fields get,
			so #collection-accent and #pick below take an explicit height instead of inheriting
			one. The padding left here keeps the border visible around the color.
		*/
		input[type="color"] {
			padding: 0.15rem;
			cursor: pointer;
		}

		#collection-accent {
			width: 2.5rem;
			height: 1.7rem;
		}

		.panel {
			margin-bottom: 2rem;
		}

		.panel:last-child {
			margin-bottom: 0;
		}

		#pick {
			width: 3.5rem;
			height: 1.9rem;
		}

		#pick-hex {
			font-family: ui-monospace, monospace;
		}

		/* capped: a few long failures would push the panel past the viewport, sticky aside and all */
		#log {
			max-height: 14rem;
			overflow-y: auto;
		}

		#log p {
			margin: 0 0 0.4rem;
			font-size: 0.8rem;
			color: var(--muted);
			/* a hex or a proxy error has no spaces to break at, and the panel is 15rem */
			overflow-wrap: anywhere;
		}

		#log p.failed {
			color: var(--error);
		}

		/*
			Five across. There is no border-box reset, so max-width is body's content box: the
			grids get 60rem less the aside and the gap, which is 43.5rem. Five of these need
			41.6rem and a sixth would need 50rem, so auto-fill settles on five.
		*/
		.grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr));
			gap: 0.4rem;
		}

		.swatch {
			display: flex;
			flex-direction: column;
			gap: 0.1rem;
			/* a floor for the shortest labels, the two lines are taller than this anyway */
			min-height: 3.2rem;
			padding: 0.6rem 0.5rem;
			border: 1px solid var(--line);
			text-align: left;
			font-family: ui-monospace, monospace;
			font-size: 0.75rem;
		}

		/*
			box-shadow, not outline: the swatch keeps its focus ring. The inner Canvas ring
			separates the marker from the swatch color, so it reads on any of them.
		*/
		.swatch.selected {
			box-shadow: 0 0 0 2px Canvas, 0 0 0 4px var(--fg);
		}

		.swatch .label {
			font-family: system-ui, sans-serif;
			opacity: 0.75;
			/* names and timestamps are longer than the swatch, and wrapping breaks the grid */
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		/*
			The swatch and its delete control stacked as siblings. The outer grid sizes this cell
			and the swatch stretches to fill it, which keeps a row of swatches one height.

			minmax(0, 1fr), not the default auto track: an auto track grows toward the swatch's
			max-content width, which is its label on one line. The swatch would then be wider than
			the cell, overflow to the right and paint over the gap.
		*/
		.cell {
			position: relative;
			display: grid;
			grid-template-columns: minmax(0, 1fr);
		}

		/*
			Hidden until the pointer or the keyboard reaches the cell. visibility, not display, for
			the same reason as the labels above: nothing reflows when it appears.
		*/
		.cell .remove {
			position: absolute;
			top: 0.15rem;
			right: 0.15rem;
			padding: 0 0.25rem;
			border: none;
			background: none;
			font-size: 0.9rem;
			line-height: 1.2;
			visibility: hidden;
		}

		.cell:hover .remove,
		.cell:focus-within .remove {
			visibility: visible;
		}

		/* a touch screen doesn't hover, so the control has nothing to come out of */
		@media (hover: none) {
			.cell .remove {
				visibility: visible;
			}
		}

		/* the color and the hex stacked as siblings, same as .cell */
		.detail-stack {
			position: relative;
		}

		.detail-color {
			/* aspect-ratio squares the content box, so a border would make it taller than wide */
			box-sizing: border-box;
			display: block;
			width: 100%;
			aspect-ratio: 1;
			padding: 0;
			border: 1px solid var(--line);
		}

		/*
			The UA stylesheet sizes the fullscreen element, but the square, the border and the
			radius survive it: the color comes out letterboxed, hairlined and round-cornered.
		*/
		.detail-color:fullscreen {
			aspect-ratio: auto;
			width: 100%;
			height: 100%;
			border: none;
			border-radius: 0;
		}

		.detail-hex {
			position: absolute;
			left: 0.5rem;
			bottom: 0.6rem;
			padding: 0.1rem 0.25rem;
			border: none;
			background: transparent;
			font-family: ui-monospace, monospace;
		}

		/* the only affordance: it has no chrome, and an underline reads on any background */
		.detail-hex:hover {
			text-decoration: underline;
		}

		.detail-label {
			margin: 0.4rem 0 0;
			color: var(--muted);
			font-size: 0.8rem;
			/* a name or a timestamp is wider than the panel, and here there is room to wrap it */
			overflow-wrap: break-word;
		}

		/* requestFullscreen is called on the strip, so it goes at once however many bands it has */
		.harmony {
			display: flex;
			gap: 0.25rem;
			width: 100%;
		}

		/* the same shape as .detail-stack, per band */
		.harmony .band {
			position: relative;
			flex: 1;
		}

		.harmony .band-color {
			/* border-box for the same reason .detail-color needs it */
			box-sizing: border-box;
			display: block;
			width: 100%;
			/* squares in the panel; the fullscreen rule below drops this so they become bands */
			aspect-ratio: 1;
			padding: 0;
			border: 1px solid var(--line);
		}

		/* full width, so the whole bottom of a band is the copy target */
		.harmony .band-hex {
			position: absolute;
			left: 0;
			right: 0;
			bottom: 0.3rem;
			padding: 0;
			border: none;
			background: transparent;
			font-family: ui-monospace, monospace;
			font-size: 0.8rem;
			text-align: center;
		}

		/* same affordance as .detail-hex */
		.harmony .band-hex:hover {
			text-decoration: underline;
		}

		/* the gap goes too: the UA paints on black, which shows through it as lines */
		.harmony:fullscreen {
			height: 100%;
			gap: 0;
		}

		.harmony:fullscreen .band-color {
			height: 100%;
			aspect-ratio: auto;
			border: none;
		}

		.harmony:fullscreen .band-hex {
			bottom: 1.5rem;
			font-size: 1.25rem;
		}

		.empty {
			color: var(--muted);
			font-size: 0.85rem;
			margin: 0;
		}
	</style>
</head>

<body>

	<header>
		<h1>wavelen</h1>
	</header>

	<div class="split">
		<main>
		<details data-collapse-key="account" open>
			<summary>Account</summary>

			<!-- Both states live in the markup and app.js hides one. The panel is the first thing
			     rendered, so building either from script would flash the wrong state. Same for
			     the two tabs below: log in is selected here, not by script. -->
			<div id="logged-out">
				<div class="tabs" role="tablist">
					<button type="button" class="tab" id="tab-login" role="tab"
						aria-controls="login-form" aria-selected="true">log in</button>
					<button type="button" class="tab" id="tab-signup" role="tab"
						aria-controls="signup-form" aria-selected="false">sign up</button>
				</div>

				<!-- The tab names the panel, so each field carries its own aria-label. -->
				<form class="row" id="login-form" role="tabpanel" aria-labelledby="tab-login">
					<input id="login-nick" placeholder="nickname" aria-label="nickname"
						autocomplete="username">
					<input id="login-password" type="password" placeholder="password"
						aria-label="password" autocomplete="current-password">
					<button>log in</button>
				</form>
				<form class="row" id="signup-form" role="tabpanel" aria-labelledby="tab-signup"
					hidden>
					<input id="new-nick" placeholder="nickname" aria-label="nickname"
						autocomplete="username">
					<input id="new-name" placeholder="name" aria-label="name">
					<input id="new-password" type="password" placeholder="password"
						aria-label="password" autocomplete="new-password">
					<button>create user</button>
				</form>
			</div>

			<div class="row" id="logged-in" hidden>
				<!-- filled from GET /me, not from the typed nickname, which is unnormalized -->
				<span class="who" id="who"></span>
				<button type="button" id="logout">log out</button>
				<button type="button" id="load">reload colors</button>
			</div>
		</details>

		<!-- Needs a token, same as the saved list, so app.js hides it logged out. -->
		<details data-collapse-key="collections" id="collections-section" open>
			<summary>Collections</summary>
			<!-- maxlength is collection.MaxNameLen: the API answers 400 past it either way -->
			<form id="collection-form">
				<div class="row">
					<label for="collection-name">new</label>
					<input id="collection-name" placeholder="name" maxlength="60">
					<!-- both are optional in the API, and these two defaults are the API's own -->
					<input type="color" id="collection-accent" value="#808080"
					       aria-label="collection accent">

					<!-- type=button, or the trigger submits the form instead of opening the
					     grid. aria-expanded is the only record of whether it is open. Both
					     are filled by app.js out of the sprite above. -->
					<div class="icon-menu">
						<button type="button" class="icon-trigger" id="icon-trigger"
							aria-haspopup="true" aria-expanded="false"
							aria-controls="icon-picker"></button>
						<div class="icon-picker" id="icon-picker" role="radiogroup"
						     aria-label="collection icon" hidden></div>
					</div>

					<button>create</button>
				</div>
			</form>
			<div class="collections" id="collections"></div>
		</details>

		<details data-collapse-key="saved" id="saved-section" open>
			<!-- the grid is one collection's colors, so the heading says which -->
			<summary>Saved colors <span id="saved-in"></span></summary>
			<form class="row" id="add-form">
				<input id="hex" placeholder="#ff00aa" aria-label="hex color">
				<button>add</button>
				<!-- type=button, or it would submit the form instead of filling the field -->
				<button type="button" id="random-hex">random</button>
				<button type="button" id="bulk-add" title="dev only: 20 separate POSTs">
					add 20 random
				</button>
			</form>
			<!-- order says descending/ascending rather than newest/oldest: it applies to hex too -->
			<div class="row">
				<!-- a button is labelable, so for= works and a click on the words steps the sort -->
				<label for="sort">sort by</label>
				<!-- cyclers: app.js writes the labels, the value stays in data-value -->
				<button type="button" id="sort" data-value="created_at"></button>
				<button type="button" id="order" data-value="desc"></button>
				<label for="limit">per page</label>
				<select id="limit">
					<option value="10">10</option>
					<option value="20" selected>20</option>
					<option value="50">50</option>
					<option value="100">100</option>
				</select>
			</div>
			<div class="grid" id="saved"></div>
			<!-- hidden until a response carries a next_cursor, which is the end-of-list signal -->
			<button type="button" id="load-more" hidden>load more</button>
		</details>

		<details data-collapse-key="palette" open>
			<summary>Palette</summary>
			<!-- the palette is 100 fixed rows, so it sorts but never pages -->
			<div class="row">
				<label for="palette-sort">sort by</label>
				<button type="button" id="palette-sort" data-value="name"></button>
				<button type="button" id="palette-order" data-value="asc"></button>
			</div>
			<div class="grid" id="palette"></div>
		</details>
		</main>

		<aside>
			<section class="panel">
				<h2 class="panel-title">View</h2>
				<div class="row">
					<button type="button" id="swatch-info"></button>
					<button type="button" id="theme"></button>
				</div>
			</section>

			<!-- Collapsible through the same data-collapse-key as the sections on the left.
			     View and Picker are one row each and stay fixed. -->
			<details class="panel" data-collapse-key="selected" open>
				<summary>Selected</summary>
				<div id="detail"></div>
			</details>

			<!-- Under Selected, not above it: the browser anchors the dialog below the swatch,
			     so what it covers is the harmony and the log rather than the color being picked. -->
			<section class="panel">
				<h2 class="panel-title">Picker</h2>
				<div class="row">
					<!-- neutral: the value only says where the dialog opens -->
					<input type="color" id="pick" value="#808080" aria-label="pick a color">
					<button type="button" id="pick-hex" title="copy"></button>
				</div>
			</section>

			<details class="panel" data-collapse-key="harmony" open>
				<summary>Harmony</summary>
				<!-- disabled until there is a selection -->
				<div class="row">
					<button type="button" id="complement" disabled>complement</button>
					<button type="button" id="triad" disabled>triad</button>
				</div>
				<div id="harmony"></div>
			</details>

			<details class="panel" data-collapse-key="log" open>
				<summary>Log</summary>
				<!-- role=log, not status: entries are added, and only the new one is read out -->
				<div id="log" role="log"></div>
			</details>
		</aside>
	</div>
</body>

</html>
