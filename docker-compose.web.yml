services:
  web:
    image: caddy:2-alpine
    container_name: wavelen-web
    ports:
      # entry point for a browser; 8080 is caddy's port
      - "127.0.0.1:${UI_PORT:-8089}:8080"
    environment:
      APP_PORT: "${PORT:-8080}" # used in Caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro # bind mount
    depends_on:
      - app
