openapi: 3.0.4
info:
  title: Wavelen API
  version: 1.0.0
  description: >-
    Just saving colors, why should we not

tags:
  - name: System
    description: Operational
  - name: Users
    description: User accounts
  - name: Auth
    description: Login
  - name: Collections
    description: A user's own groups of colors
  - name: Colors
    description: The colors inside one collection
  - name: Palette
    description: The shared read-only palette
  - name: Harmony
    description: Compute some colors based on a specific one.

paths:
  /:
    get:
      tags: [System]
      summary: Serves the web UI
      description: >-
        The single page app embedded in the binary. 
        Every path the API does not cover falls here.
      responses:
        "200":
          description: The page
          content:
            # no schema: the body is a document
            text/html: {}

  /api/v1/version:
    get:
      tags: [System]
      summary: Returns the build-time version
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /livez:
    get:
      tags: [System]
      summary: Checks if the service is alive
      responses:
        "200":
          description: The process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      tags: [System]
      summary: Checks if the service can reach its database
      responses:
        "200":
          description: The service and Postgres are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Postgres is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependencyUnavailableResponse"

  /api/v1/users:
    post:
      tags: [Users]
      summary: Creates a user (sign up)
      description: The nickname is trimmed and lowercased before storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: The nickname is already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: nickname already taken
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/tokens:
    post:
      tags: [Auth]
      summary: Exchanges a nickname and password for an authentication token
      description: An unknown nickname and a wrong password answer the same
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Token issued
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Logout. Revokes the token
      description: >-
        The token in the 'Authorization' header is deleted and stops working.
        This user's other tokens are untouched. An already invalid token
        answers 401, not 204.
      responses:
        "204":
          description: The token was revoked
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/me:
    get:
      tags: [Users]
      security:
        - bearerAuth: []
      summary: The account the token belongs to
      responses:
        "200":
          description: The account
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFoundUser"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/me/collections:
    get:
      tags: [Collections]
      security:
        - bearerAuth: []
      summary: Lists all collections, oldest first.
      responses:
        "200":
          description: Collections
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCollectionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Collections]
      security:
        - bearerAuth: []
      summary: Creates a collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCollectionRequest"
      responses:
        "201":
          description: The collection was created
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFoundUser"
        "409":
          description: Collection quota is exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: collection quota full
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/me/collections/{collectionId}:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
    get:
      tags: [Collections]
      security:
        - bearerAuth: []
      summary: One collection
      responses:
        "200":
          description: The collection
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFoundCollection"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Collections]
      security:
        - bearerAuth: []
      summary: Removes the collection and all its colors
      description: The default collection cannot be removed.
      responses:
        "204":
          description: The collection was removed
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFoundCollection"
        "409":
          description: The default collection cannot be deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/me/collections/{collectionId}/colors:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
    get:
      tags: [Colors]
      security:
        - bearerAuth: []
      summary: List the collection colors
      description: >-
        Ordered by the 'sort'. No 'next_cursor' means the end of the list.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: sort
          in: query
          required: false
          description: >-
            The page is ordered by it. 'hex' is the tiebreak for 'created_at' and 'color'.
            'hex' is lexicographic; 'color' is perceptual
          schema:
            type: string
            enum: [created_at, hex, color]
            default: created_at
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          example: "Y3JlYXRlZF9hdHxkZXNjfDIwMjYtMDgtMjNUMTQ6MDA6MDAuODI1MDIzWnwjZmYwMGFh"
      responses:
        "200":
          description: The collection colors
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListColorsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFoundCollection"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Colors]
      security:
        - bearerAuth: []
      summary: Adds a color into collection
      description: >-
        Idempotent. Adding an already existing color returns the same body with 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddColorRequest"
      responses:
        "201":
          description: The color was added
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddColorResponse"
        "200":
          description: The color was already in the collection
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddColorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFoundCollection"
        "409":
          description: The color quota is exceeded for this collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: color quota full
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Colors]
      security:
        - bearerAuth: []
      summary: Removes every color from the collection
      description: The collection will remain.
      responses:
        "204":
          description: The collection is empty
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFoundCollection"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/me/collections/{collectionId}/colors/{hex}:
    parameters:
      - $ref: "#/components/parameters/CollectionId"
      - $ref: "#/components/parameters/ColorHex"
    delete:
      tags: [Colors]
      security:
        - bearerAuth: []
      summary: Removes a color from the collection
      responses:
        "204":
          description: The color was removed
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such collection, or no such color inside it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: not found
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/colors:
    get:
      tags: [Palette]
      summary: Lists the shared palette
      description: The 100 preset named colors.
      parameters:
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, hex, color]
            default: name
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: The palette
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCommonColorsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/colors/{hex}/{harmony}:
    parameters:
      - $ref: "#/components/parameters/ColorHex"
      - $ref: "#/components/parameters/Harmony"
    get:
      tags: [Harmony]
      summary: Returns colors that are calculated from the incoming hex (path value) using a specified harmony (path value)
      description: What we call "harmony" in the app is usually described as a color "scheme".
      responses:
        "200":
          description: The derived harmony colors
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/HarmonyCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarmonyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFoundHarmony"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        The token from POST /api/v1/tokens. Only its SHA-256 is stored, can't be recovered.

  headers:
    XRequestId:
      description: Correlation id, generated by the server. A client-sent X-Request-Id is ignored.
      schema:
        type: string

    RetryAfter:
      description: Amount of seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
      example: 1

    HarmonyCacheControl:
      description: >-
        A harmony depends on the URL and the formula, the formula only changes with a deploy.
      schema:
        type: string
      example: "public, max-age=31536000, immutable"

  parameters:
    CollectionId:
      name: collectionId
      in: path
      required: true
      description: A collection uuid.
      schema:
        type: string
        format: uuid

    ColorHex:
      name: hex
      in: path
      required: true
      description: >-
        A color as six hex digits WITHOUT the leading '#'. Case does not matter.
        Responses carry the stored form with '#'.
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{6}$"
      example: "ff00aa"

    Harmony:
      name: harmony
      in: path
      required: true
      description: The harmony name.
      schema:
        $ref: "#/components/schemas/HarmonyName"

  schemas:
    HarmonyName:
      type: string
      description: Supported harmonies.
      enum:
        - complement
        - analogous
        - triad
        - split-complement
        - square
        - ramp
        - tones
      example: triad

    HexStored:
      type: string
      description: A color code as stored and returned, lowercase with a leading '#'.
      pattern: "^#[0-9a-f]{6}$"
      example: "#ff00aa"

    HexInput:
      type: string
      description: >-
        A color code as accepted. Surrounding whitespace trimmed, the leading '#' is
        optional, case does not matter. The normalized form is stored.
      pattern: "^\\s*#?[0-9a-fA-F]{6}\\s*$"
      example: "FF00AA"

    CreateUserRequest:
      type: object
      required: [nickname, name, password]
      additionalProperties: false
      properties:
        nickname:
          $ref: "#/components/schemas/Nickname"
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Length is counted in runes, after trimming.
          example: Olya Lovelace
        password:
          $ref: "#/components/schemas/Password"

    Nickname:
      type: string
      description: >-
        The login identifier, 3 to 30 chars. Letters, digits, '_', '-'. Starts and ends with 
        a letter or a digit. All is lowercased and surrounding whitespace trimmed before storing.
      pattern: "^\\s*[A-Za-z0-9][A-Za-z0-9_-]{1,28}[A-Za-z0-9]\\s*$"
      example: salandered-123

    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 72
      description: Length is counted in bytes

    CreateTokenRequest:
      type: object
      required: [nickname, password]
      additionalProperties: false
      properties:
        nickname:
          $ref: "#/components/schemas/Nickname"
        password:
          $ref: "#/components/schemas/Password"

    CreateTokenResponse:
      type: object
      required: [token, expiry]
      properties:
        token:
          type: string
          description: Send it as an 'Authorization' header, 'Bearer <token>'.
          example: X3ASTT2CDAN66BACKSCI4SU7SI
        expiry:
          type: string
          format: date-time
          example: "2026-09-02T13:37:08.688203Z"

    User:
      type: object
      required: [nickname, name, created_at]
      properties:
        nickname:
          type: string
          description: The stored form.
          pattern: "^[a-z0-9]([a-z0-9_-]*[a-z0-9])?$"
          example: salandered-123
        name:
          type: string
          example: Olya Lovelace
        created_at:
          type: string
          format: date-time
          example: "2026-08-22T13:37:08.688203Z"

    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    CollectionName:
      type: string
      minLength: 1
      maxLength: 60
      description: >-
        Free form, display only. Length is counted in runes, after trimming. Not unique.
      example: Sunset palette

    CollectionIcon:
      type: string
      description: A slug out of the icon set the UI ships.
      enum:
        - anchor
        - brush
        - camera
        - cat
        - cloud
        - coffee
        - crown
        - droplet
        - fish
        - flower
        - gem
        - heart
        - image
        - layers
        - leaf
        - moon
        - mountain
        - music
        - palette
        - pipette
        - snowflake
        - square
        - star
        - sun
        - tag
      example: star

    CreateCollectionRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/CollectionName"
        icon:
          $ref: "#/components/schemas/CollectionIcon"
        accent:
          $ref: "#/components/schemas/HexInput"

    Collection:
      type: object
      required: [id, name, icon, accent, is_default, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: A uuidv7, generated by the server.
          example: "01a083f4-5c2f-71d9-9757-5d6635ded04d"
        name:
          $ref: "#/components/schemas/CollectionName"
        icon:
          $ref: "#/components/schemas/CollectionIcon"
        accent:
          $ref: "#/components/schemas/HexStored"
        is_default:
          type: boolean
          description: The default collection. One per user, cannot be deleted.
          example: true
        created_at:
          type: string
          format: date-time
          example: "2026-08-22T13:37:08.688203Z"

    CollectionResponse:
      type: object
      required: [collection]
      properties:
        collection:
          $ref: "#/components/schemas/Collection"

    ListCollectionsResponse:
      type: object
      required: [collections]
      properties:
        collections:
          type: array
          items:
            $ref: "#/components/schemas/Collection"

    AddColorRequest:
      type: object
      required: [hex]
      additionalProperties: false
      properties:
        hex:
          $ref: "#/components/schemas/HexInput"

    AddColorResponse:
      type: object
      required: [hex]
      description: Echoes the normalized hex
      properties:
        hex:
          $ref: "#/components/schemas/HexStored"

    SavedColor:
      type: object
      required: [hex, created_at]
      properties:
        hex:
          $ref: "#/components/schemas/HexStored"
        created_at:
          type: string
          format: date-time
          example: "2026-08-22T13:37:08.825023Z"

    CursorMetadata:
      type: object
      required: [limit]
      properties:
        limit:
          type: integer
          description: The page size
          example: 50
        next_cursor:
          type: string
          description: Absent at the end of the list.
          example: "Y3JlYXRlZF9hdHxkZXNjfDIwMjYtMDgtMjNUMTQ6MDA6MDAuODI1MDIzWnwjZmYwMGFh"

    ListColorsResponse:
      type: object
      required: [colors, metadata]
      properties:
        colors:
          type: array
          items:
            $ref: "#/components/schemas/SavedColor"
        metadata:
          $ref: "#/components/schemas/CursorMetadata"

    CommonColor:
      type: object
      required: [hex, name]
      properties:
        hex:
          $ref: "#/components/schemas/HexStored"
        name:
          type: string
          example: black

    ListCommonColorsResponse:
      type: object
      required: [colors]
      properties:
        colors:
          type: array
          items:
            $ref: "#/components/schemas/CommonColor"

    HarmonyResponse:
      type: object
      required: [hex, harmony, colors]
      description: >-
        Echoes the normalized incoming hex 'hex', the harmony name 'harmony'
        and the derived colors 'colors'.
        Incoming hex is not included in 'colors'.
        'colors' length fixed per harmony: 
        1 for complement,
        2 for analogous, triad and split-complement, 
        3 for square, 
        7 for ramp and tones.
      properties:
        hex:
          $ref: "#/components/schemas/HexStored"
        harmony:
          $ref: "#/components/schemas/HarmonyName"
        colors:
          type: array
          minItems: 1
          maxItems: 7
          items:
            $ref: "#/components/schemas/HexStored"

    VersionResponse:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version:
          type: string
          example: "0.1.0"

    HealthResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]

    DependencyUnavailableResponse:
      type: object
      required: [status, dependency]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [unavailable]
        dependency:
          type: string
          enum: [postgres]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

  responses:
    BadRequest:
      description: Malformed path parameter, body, or field
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: 'invalid hex color "123": must be 6 hex digits'

    Unauthorized:
      description: No credential or they can't be verified
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: invalid credentials

    PayloadTooLarge:
      description: The body exceeded a server limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: request body too large

    NotFoundCollection:
      description: No such collection
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: not found

    NotFoundHarmony:
      description: No harmony by that name
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: >-
              unknown harmony "tetrad": one of complement, analogous, triad, split-complement,
              square, ramp, tones

    NotFoundUser:
      description: No such user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: user not found

    TooManyRequests:
      description: Too many requests
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: server is busy, retry later

    InternalServerError:
      description: Unexpected failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: internal server error
