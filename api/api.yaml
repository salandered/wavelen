openapi: 3.0.4
info:
  title: Wavelen API
  version: 1.0.0
  description: >-
    Just saving colors, why should we not

tags:
  - name: System
    description: Operational
  - name: Users
    description: User accounts
  - name: Auth
    description: Login
  - name: Colors
    description: A user's own saved colors
  - name: Palette
    description: The shared read-only palette
  - name: Harmony
    description: Colors computed from a color. Nothing is read or stored.

paths:
  /:
    get:
      tags: [System]
      summary: Returns the service name and build-time version
      responses:
        "200":
          description: Successful response
          content:
            text/plain:
              schema:
                type: string
                example: "wavelen version 0.1.0"

  /livez:
    get:
      tags: [System]
      summary: Checks if the service is alive
      responses:
        "200":
          description: The process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      tags: [System]
      summary: Checks if the service can reach its database
      responses:
        "200":
          description: The service and Postgres are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Postgres is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependencyUnavailableResponse"

  /api/v1/users:
    post:
      tags: [Users]
      summary: Creates a user (sign up)
      description: >-
        The nickname is trimmed and lowercased before storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: The nickname is already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: nickname already taken
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/tokens:
    post:
      tags: [Auth]
      summary: Exchanges a nickname and password for an authentication token
      description: An unknown nickname and a wrong password answer the same
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: Token issued
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Auth]
      security:
        - bearerAuth: []
      summary: Logout. Revokes the token
      description: >-
        The token in the `Authorization` header is deleted and stops working.
        This user's other tokens are untouched. An already invalid token
        answers 401, not 204.
      responses:
        "204":
          description: The token was revoked
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/me:
    get:
      tags: [Users]
      security:
        - bearerAuth: []
      summary: The account the token belongs to
      responses:
        "200":
          description: The account
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: user not found
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/me/colors:
    get:
      tags: [Colors]
      security:
        - bearerAuth: []
      summary: Lists your saved colors
      description: >-
        Ordered by the `sort`. No `next_cursor` means the end of the list.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: sort
          in: query
          required: false
          description: >-
            The page is ordered by it. hex is the tiebreak for created_at and for color.
            hex is lexicographic; color is perceptual
          schema:
            type: string
            enum: [created_at, hex, color]
            default: created_at
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          example: "Y3JlYXRlZF9hdHxkZXNjfDIwMjYtMDgtMjNUMTQ6MDA6MDAuODI1MDIzWnwjZmYwMGFh"
      responses:
        "200":
          description: Your saved colors
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListColorsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Colors]
      security:
        - bearerAuth: []
      summary: Saves a color
      description: >-
        Idempotent. Saving an already existing color returns the same body with 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddColorRequest"
      responses:
        "201":
          description: The color was added
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddColorResponse"
        "200":
          description: You had already saved this color
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddColorResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: user not found
        "409":
          description: You exceeded the color quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/me/colors/{hex}:
    parameters:
      - $ref: "#/components/parameters/ColorHex"
    delete:
      tags: [Colors]
      security:
        - bearerAuth: []
      summary: Removes one of your saved colors
      responses:
        "204":
          description: The color was removed
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: You don't have this color
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: not found
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/colors:
    get:
      tags: [Palette]
      summary: Lists the shared palette
      description: >-
        The 100 seeded named colors, ordered by the `sort`.
      parameters:
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [name, hex, color]
            default: name
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        "200":
          description: The palette
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCommonColorsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/colors/{hex}/complement:
    parameters:
      - $ref: "#/components/parameters/ColorHex"
    get:
      tags: [Harmony]
      summary: The opposite color
      description: >-
        The hue turned half a circle in OkLCh, chroma kept and lightness moved only as far as
        sRGB forces.
      responses:
        "200":
          description: The complement
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/HarmonyCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplementResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/colors/{hex}/triad:
    parameters:
      - $ref: "#/components/parameters/ColorHex"
    get:
      tags: [Harmony]
      summary: The two colors evenly spaced from this one
      description: >-
        The hue turned a third and two thirds of a circle in OkLCh, chroma kept and lightness
        moved only as far as sRGB forces.
      responses:
        "200":
          description: The other two corners of the triangle
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/HarmonyCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        The token from POST /api/v1/tokens. Only its SHA-256 is stored, can't be recovered.

  headers:
    XRequestId:
      description: Correlation id, generated by the server. A client-sent X-Request-Id is ignored.
      schema:
        type: string

    HarmonyCacheControl:
      description: >-
        A harmony depends on the URL and the formula, and the formula only changes with a deploy.
      schema:
        type: string
      example: "public, max-age=31536000, immutable"

  parameters:
    ColorHex:
      name: hex
      in: path
      required: true
      description: >-
        A color as six hex digits WITHOUT the leading '#'. Case does not matter.
        Responses carry the stored form with '#'.
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{6}$"
      example: "ff00aa"

  schemas:
    HexStored:
      type: string
      description: A color code as stored and returned, lowercase with a leading '#'.
      pattern: "^#[0-9a-f]{6}$"
      example: "#ff00aa"

    HexInput:
      type: string
      description: >-
        A color code as accepted. Surrounding whitespace is trimmed, the leading '#' is
        optional, case does not matter. The normalized form is stored.
      pattern: "^\\s*#?[0-9a-fA-F]{6}\\s*$"
      example: "FF00AA"

    CreateUserRequest:
      type: object
      required: [nickname, name, password]
      additionalProperties: false
      properties:
        nickname:
          $ref: "#/components/schemas/Nickname"
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Length is counted in runes, after trimming.
          example: Olya Lovelace
        password:
          $ref: "#/components/schemas/Password"

    Nickname:
      type: string
      description: >-
        The login identifier, 3 to 30 characters. Letters, digits, '_', '-'. Starts and
        ends with a letter or a digit. All is lowercased and surrounding whitespace trimmed 
        before storing.
      pattern: "^\\s*[A-Za-z0-9][A-Za-z0-9_-]{1,28}[A-Za-z0-9]\\s*$"
      example: salandered-123

    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 72
      description: Length is counted in bytes

    CreateTokenRequest:
      type: object
      required: [nickname, password]
      additionalProperties: false
      properties:
        nickname:
          $ref: "#/components/schemas/Nickname"
        password:
          $ref: "#/components/schemas/Password"

    CreateTokenResponse:
      type: object
      required: [token, expiry]
      properties:
        token:
          type: string
          description: Send it as an 'Authorization' header, 'Bearer <token>'.
          example: X3ASTT2CDAN66BACKSCI4SU7SI
        expiry:
          type: string
          format: date-time
          example: "2026-09-02T13:37:08.688203Z"

    User:
      type: object
      required: [nickname, name, created_at]
      properties:
        nickname:
          type: string
          description: The stored form.
          pattern: "^[a-z0-9]([a-z0-9_-]*[a-z0-9])?$"
          example: salandered-123
        name:
          type: string
          example: Olya Lovelace
        created_at:
          type: string
          format: date-time
          example: "2026-08-22T13:37:08.688203Z"

    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    AddColorRequest:
      type: object
      required: [hex]
      additionalProperties: false
      properties:
        hex:
          $ref: "#/components/schemas/HexInput"

    AddColorResponse:
      type: object
      required: [hex]
      description: Echoes the normalized hex
      properties:
        hex:
          $ref: "#/components/schemas/HexStored"

    SavedColor:
      type: object
      required: [hex, created_at]
      properties:
        hex:
          $ref: "#/components/schemas/HexStored"
        created_at:
          type: string
          format: date-time
          example: "2026-08-22T13:37:08.825023Z"

    CursorMetadata:
      type: object
      required: [limit]
      properties:
        limit:
          type: integer
          description: The page size
          example: 50
        next_cursor:
          type: string
          description: Absent at the end of the list.
          example: "Y3JlYXRlZF9hdHxkZXNjfDIwMjYtMDgtMjNUMTQ6MDA6MDAuODI1MDIzWnwjZmYwMGFh"

    ListColorsResponse:
      type: object
      required: [colors, metadata]
      properties:
        colors:
          type: array
          items:
            $ref: "#/components/schemas/SavedColor"
        metadata:
          $ref: "#/components/schemas/CursorMetadata"

    CommonColor:
      type: object
      required: [hex, name]
      properties:
        hex:
          $ref: "#/components/schemas/HexStored"
        name:
          type: string
          example: black

    ListCommonColorsResponse:
      type: object
      required: [colors]
      properties:
        colors:
          type: array
          items:
            $ref: "#/components/schemas/CommonColor"

    ComplementResponse:
      type: object
      required: [hex, complement]
      description: Echoes the normalized hex asked about, beside its complement.
      properties:
        hex:
          $ref: "#/components/schemas/HexStored"
        complement:
          $ref: "#/components/schemas/HexStored"

    TriadResponse:
      type: object
      required: [hex, triad]
      description: >-
        Echoes the normalized hex asked about, beside the OTHER two colors of the triad in hue
        order. The color asked about is not repeated in the array.
      properties:
        hex:
          $ref: "#/components/schemas/HexStored"
        triad:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/HexStored"

    HealthResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]

    DependencyUnavailableResponse:
      type: object
      required: [status, dependency]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [unavailable]
        dependency:
          type: string
          enum: [postgres]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: For 5xx this is always the "internal server error"
          example: invalid hex color

  responses:
    BadRequest:
      description: Malformed path parameter, body, or field
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: 'invalid hex color: want 6 hex digits, got "nope"'

    Unauthorized:
      description: No credential or they can't be verified
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: invalid credentials

    PayloadTooLarge:
      description: The body exceeded 64 kb
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: request body too large

    InternalServerError:
      description: Unexpected failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: internal server error
